name: GameCI CLI
description: Install and run the GameCI CLI from a GitHub Actions workflow.
author: GameCI

branding:
  icon: terminal
  color: green

inputs:
  args:
    description: Arguments to pass to game-ci. Leave empty to install the CLI without running it.
    required: false
    default: ''
  version:
    description: >
      CLI release version to install, for example v0.1.0. Defaults to the action ref when the ref
      looks like a version tag, otherwise latest.
    required: false
    default: ''
  working-directory:
    description: Directory where the game-ci command should run.
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Install GameCI CLI
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail

        version="${{ inputs.version }}"
        action_ref="${{ github.action_ref }}"

        if [ -z "$version" ] && printf '%s' "$action_ref" | grep -Eq '^v[0-9]'; then
          version="$action_ref"
        fi

        export GAME_CI_INSTALL="${RUNNER_TEMP}/game-ci/bin"
        if [ -n "$version" ]; then
          export GAME_CI_VERSION="$version"
        fi

        # install.sh is a thin wrapper that delegates to scripts/install.sh
        # (the single source of truth for platform detection, version
        # resolution, download, checksum verification and extraction). Run
        # from the checked-out action path, it picks up the scripts/install.sh
        # sitting next to it, so this step needs no network fetch of the
        # installer and always matches the ref this action was checked out at.
        "${GITHUB_ACTION_PATH}/install.sh"
        echo "$GAME_CI_INSTALL" >> "$GITHUB_PATH"

    # Intentionally NOT sharing scripts/install.sh with the branch above:
    # that script is bash, and Windows runners' PowerShell path has no bash
    # to run it with. This branch (and install.ps1) stays self-contained on
    # purpose - keep it in sync by hand when the install flow changes.
    - name: Install GameCI CLI
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        $repo = 'game-ci/cli'
        $version = '${{ inputs.version }}'
        $actionRef = '${{ github.action_ref }}'

        if (-not $version -and $actionRef -match '^v[0-9]') {
          $version = $actionRef
        }

        if (-not $version) {
          $release = Invoke-RestMethod "https://api.github.com/repos/$repo/releases/latest"
          $version = $release.tag_name
        }

        $installDir = Join-Path $env:RUNNER_TEMP 'game-ci\bin'
        $binaryPath = Join-Path $installDir 'game-ci.exe'
        # The release archive, not a bare .exe: the binary alone isn't
        # self-contained - it resolves its own static assets
        # (default-build-script/, platforms/*, unity-config/services-config.json.template)
        # relative to its own directory on disk, shipped as dist/ alongside
        # it inside this same archive (see game-ci/cli#73 and
        # release-cli.yml's matching comment).
        $assetName = 'game-ci-windows-x64.zip'
        $archivePath = Join-Path $env:RUNNER_TEMP $assetName
        $downloadUrl = "https://github.com/$repo/releases/download/$version/$assetName"
        $checksumUrl = "https://github.com/$repo/releases/download/$version/checksums.txt"

        New-Item -ItemType Directory -Force -Path $installDir | Out-Null
        Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath -UseBasicParsing

        $expectedHash = ''
        try {
          # .Content on a plain-text response can come back as a raw byte[]
          # rather than a decoded string, depending on the PowerShell/runner
          # combination - explicitly decode rather than assuming a string,
          # since a silent type mismatch here makes every checksum check a
          # silent no-op (an empty $expectedHash skips verification below
          # without ever surfacing a warning).
          $response = Invoke-WebRequest -Uri $checksumUrl -UseBasicParsing
          $checksums = if ($response.Content -is [byte[]]) {
            [System.Text.Encoding]::UTF8.GetString($response.Content)
          } else {
            $response.Content
          }
          $expectedLine = $checksums -split "`n" | Where-Object { $_ -match [regex]::Escape($assetName) } | Select-Object -First 1
          if ($expectedLine -match '^(\S+)') {
            $expectedHash = $Matches[1].ToLower()
          }
        } catch {
          Write-Warning "Checksum verification skipped because checksum metadata could not be fetched: $_"
        }

        if ($expectedHash) {
          $actualHash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLower()
          if ($expectedHash -ne $actualHash) {
            throw "Checksum verification failed. Expected $expectedHash, got $actualHash"
          }
        }

        Expand-Archive -Path $archivePath -DestinationPath $installDir -Force
        Remove-Item $archivePath

        & $binaryPath --help | Out-Null
        $installDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Run GameCI CLI
      if: inputs.args != '' && runner.os != 'Windows'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: game-ci ${{ inputs.args }}

    - name: Run GameCI CLI
      if: inputs.args != '' && runner.os == 'Windows'
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: game-ci ${{ inputs.args }}
