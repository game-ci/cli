name: Tests

on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  # Compute which areas of the monorepo a PR actually touches, so each
  # suite below only runs when it's relevant. Anything under src/ (the
  # CLI core + built-in engine plugins) is treated as cross-cutting and
  # runs everything, since the plugin interface lives there.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      orchestrator: ${{ steps.filter.outputs.orchestrator }}
      unity: ${{ steps.filter.outputs.unity }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cli:
              - 'src/**'
              - 'dist/**'
              - 'scripts/**'
              # The root installer and the Action that runs it: without
              # these, a PR touching only install.sh skips the install
              # smoke tests below - the exact blind spot that let the root
              # installer 404 on every platform for releases on end (#242).
              - 'install.sh'
              - 'action.yml'
              - 'package.json'
              - 'bunfig.toml'
              - '.github/workflows/tests.yml'
            orchestrator:
              - 'plugins/orchestrator/**'
              - '.github/workflows/tests.yml'
            unity:
              - 'plugins/unity/**'
              - '.github/workflows/tests.yml'

  tests:
    name: Tests
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Code conventions
        run: bun run lint
      # `bun run test` (not bare `bun test`) - the script scopes to ./src.
      # Bare `bun test` treats its argument as a substring filter, not a
      # path, so it would also glob plugins/orchestrator's vitest suites
      # and fail on a runner mismatch.
      - name: Unit/Integration tests
        run: bun run test
      # dist/platforms and dist/default-build-script are hand-maintained
      # bash/PowerShell/C# scripts the compiled binary mounts and copies at
      # runtime (see release-cli.yml's `cp -r dist pkg/dist`) - not build
      # outputs, and nothing else in this suite ever parses them. A single
      # session found five real bugs hiding in exactly this class of file
      # (#159, #176, #180) - none would have compiled, typechecked, or
      # unit-tested their way into visibility. ubuntu-latest ships pwsh by
      # default, so this needs no extra setup.
      - name: Validate platform scripts (dist/platforms)
        run: bash scripts/validate-platform-scripts.sh
      # scripts/install.sh is fetched and run directly by engine wrappers
      # (unity-builder and future ones) - see its own header comment - so a
      # syntax error here breaks every wrapper's CLI install step, not just
      # something local to this repo.
      - name: Syntax-check scripts/*.sh
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" || { echo "FAIL: $f has a bash syntax error"; exit 1; }
          done
      # Runs the actual install flow against the latest published release,
      # not just a syntax check - install.sh isn't run by anything else in
      # this repo's own CI (it's fetched and run by wrapper repos instead,
      # see its header comment), so without this, a break here is only ever
      # caught downstream, in a different repo's CI, the way the SIGPIPE bug
      # from `grep -m1` piped straight off curl's output was.
      - name: Smoke-test scripts/install.sh against the latest release
        # Retries a 404 a few times: "latest" can resolve to a release whose
        # per-platform binaries are still uploading - the release object
        # itself is created (and "latest"-resolvable) the moment
        # `gh release create` runs, but Release CLI Binaries (triggered by
        # that same release: published event) takes a couple of minutes to
        # build and attach every platform's archive. A push to main that
        # lands in that window - e.g. this repo's own version-bump commit,
        # created right after cutting the release it's for - hit exactly
        # this 404 in practice, failing Tests on main itself, not just a PR.
        run: |
          for attempt in 1 2 3 4 5; do
            # install.sh writes progress to stderr and only the final binary
            # path to stdout (see its own header comment) - only stdout is
            # captured here so a retry's own log noise can never end up
            # embedded in $binary_path on a later successful attempt.
            if binary_path="$(bash scripts/install.sh latest /tmp/install-sh-smoke-test)"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "FAIL: scripts/install.sh still failing after 5 attempts"
              exit 1
            fi
            echo "install.sh failed (attempt $attempt/5) - likely the latest release's binaries are still uploading - retrying in 30s..."
            sleep 30
          done
          [ -x "$binary_path" ] || { echo "FAIL: $binary_path is not executable"; exit 1; }
          # The binary is not self-contained - it resolves its static assets
          # from a dist/ directory that has to sit next to it (game-ci/cli#73),
          # so a "successful" install that only lays down the executable is
          # still broken at runtime.
          [ -d "$(dirname "$binary_path")/dist" ] || { echo "FAIL: dist/ was not extracted next to $binary_path"; exit 1; }
          "$binary_path" --help
      # The root install.sh (the `curl | sh` installer, and what action.yml
      # runs on Linux/macOS) had no CI coverage at all, which is how it got
      # to spend releases 404ing on every platform (#242) unnoticed. It now
      # delegates to scripts/install.sh, so this only has to prove the
      # wrapper end of that contract still holds. No retry loop: the step
      # above has already established that the latest release is fully
      # uploaded.
      - name: Smoke-test the root install.sh wrapper
        run: |
          export GAME_CI_INSTALL=/tmp/root-install-sh-smoke-test
          sh ./install.sh
          [ -x "$GAME_CI_INSTALL/game-ci" ] || { echo "FAIL: game-ci not installed to $GAME_CI_INSTALL"; exit 1; }
          [ -d "$GAME_CI_INSTALL/dist" ] || { echo "FAIL: dist/ was not extracted next to the binary"; exit 1; }
          "$GAME_CI_INSTALL/game-ci" --help

  # Mirrors plugins/unity/.github/workflows/integrity-check.yml, which is
  # inert (GitHub only reads root .github/workflows/) - ported here rather
  # than left to bit-rot unreachable. Uses bun, not the original's `npm ci`
  # - plugins/unity has no npm-specific script coupling (verified: grep for
  # a bare `npm` in its scripts/package.json turns up nothing), and root
  # already resolves the whole workspace via one `bun install`.
  unity-tests:
    name: Unity engine core tests
    needs: changes
    if: needs.changes.outputs.unity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/unity
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
        working-directory: .
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Verify dist is up to date
        run: |
          bun run build
          [ -z "$(git status --porcelain dist)" ] || { echo "plugins/unity/dist is out of date - run 'bun run build' in plugins/unity and commit the result"; git status --porcelain dist; git diff dist; exit 1; }

  # Mirrors plugins/orchestrator/.github/workflows/test.yml (also inert as
  # a nested workflow). Orchestrator's scripts hardcode `yarn` (lint calls
  # `yarn oxlint` directly), so - unlike unity - this genuinely needs yarn
  # via corepack, not bun. That's intentional, not fragmentation to "fix":
  # see AGENTS.md's package-manager note.
  orchestrator-tests:
    name: Orchestrator tests
    needs: changes
    if: needs.changes.outputs.orchestrator == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins/orchestrator
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Install package manager (from package.json)
        run: |
          corepack enable
          corepack install
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Resolve yarn cache folder
        id: yarn-config
        run: echo "cacheFolder=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            plugins/orchestrator/node_modules
            ${{ steps.yarn-config.outputs.cacheFolder }}
            plugins/orchestrator/.yarn/install-state.gz
          key: yarn-v2-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('plugins/orchestrator/yarn.lock') }}
          restore-keys: |
            yarn-v2-${{ runner.os }}-node${{ matrix.node-version }}-
      - name: Install deps
        env:
          YARN_ENABLE_HARDENED_MODE: 'false'
        run: |
          case "$(yarn --version)" in 1.*) echo 'expected up-to-date yarn version'; exit 1 ;; esac
          yarn install --immutable
      - name: Format
        run: yarn format:check
      - name: Lint
        run: yarn lint
      - name: Build
        run: yarn build
      - name: Typecheck
        run: yarn typecheck
      - name: Test
        run: yarn coverage
      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            plugins/orchestrator/node_modules
            ${{ steps.yarn-config.outputs.cacheFolder }}
            plugins/orchestrator/.yarn/install-state.gz
          key: yarn-v2-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('plugins/orchestrator/yarn.lock') }}
        timeout-minutes: 5
        continue-on-error: true

  # Mirrors plugins/orchestrator/.github/workflows/integration-ci.yml
  # (a workflow_call file, invoked by the old ci.yml on every PR).
  # Despite the job names, this runs against local emulators only
  # (k3d for k8s, MiniStack for AWS) - no real cloud account needed. Only
  # secrets required: GIT_PRIVATE_TOKEN/UNITY_EMAIL/UNITY_PASSWORD/
  # UNITY_SERIAL, the same ones root's own engine-smoke-test.yml already
  # depends on.
  orchestrator-integration:
    name: Orchestrator integration (local emulators)
    needs: changes
    if: needs.changes.outputs.orchestrator == 'true'
    uses: ./.github/workflows/orchestrator-integration.yml
    secrets: inherit

  # Aggregate gate: stays green when a suite is legitimately skipped, but
  # fails if any suite that DID run failed. Branch protection should
  # require this single check rather than the individual suites above -
  # otherwise a skipped-but-required job blocks every scoped PR.
  tests-gate:
    name: Tests gate
    needs: [tests, unity-tests, orchestrator-tests, orchestrator-integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify no suite failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "A test suite failed."
            exit 1
          fi
          echo "All test suites that ran are green."
