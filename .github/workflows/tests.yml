name: Tests

on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Code conventions
        run: bun run lint
      - name: Unit/Integration tests
        run: bun test
