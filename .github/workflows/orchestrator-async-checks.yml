name: Orchestrator Async Checks API

# Port of plugins/orchestrator/.github/workflows/orchestrator-async-checks.yml,
# inert as a nested workflow. Manual-dispatch only, never runs on its own.
# GKE_*/GCP_* env vars are set but no GCP secret is ever referenced, so
# they're inert config, not a live GCP dependency; the real AWS integration
# below is commented out in favor of local-docker (ORCHESTRATOR_CLUSTER:
# local-docker) - this workflow needs only the standard UNITY_LICENSE/
# GITHUB_TOKEN secrets already used elsewhere in this repo.

on:
  workflow_dispatch:
    inputs:
      checksObject:
        description: ''
        required: false
        default: ''

permissions:
  checks: write

defaults:
  run:
    working-directory: plugins/orchestrator

env:
  GKE_ZONE: 'us-central1'
  GKE_REGION: 'us-central1'
  GKE_PROJECT: 'unitykubernetesbuilder'
  GKE_CLUSTER: 'game-ci-github-pipelines'
  GCP_LOGGING: true
  GCP_PROJECT: unitykubernetesbuilder
  GCP_LOG_FILE: ${{ github.workspace }}/plugins/orchestrator/orchestrator-logs.txt
  # Commented out: Using MiniStack tests instead of real AWS
  # AWS_REGION: eu-west-2
  # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  # AWS_DEFAULT_REGION: eu-west-2
  # AWS_STACK_NAME: game-ci-github-pipelines
  ORCHESTRATOR_BRANCH: ${{ github.ref }}
  ORCHESTRATOR_DEBUG: true
  ORCHESTRATOR_DEBUG_TREE: true
  DEBUG: true
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  PROJECT_PATH: test-project
  UNITY_VERSION: 2019.3.15f1
  USE_IL2CPP: false

jobs:
  asyncChecks:
    name: Async Checks
    if: github.event.event_type != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install package manager (from package.json)
        run: |
          corepack enable
          corepack install
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve yarn cache folder
        id: yarn-config
        run: echo "cacheFolder=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            plugins/orchestrator/node_modules
            ${{ steps.yarn-config.outputs.cacheFolder }}
            plugins/orchestrator/.yarn/install-state.gz
          key: yarn-${{ runner.os }}-node-20-${{ hashFiles('plugins/orchestrator/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-node-20-
      - timeout-minutes: 180
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          PROJECT_PATH: test-project
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_PRIVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_PLATFORM: StandaloneWindows64
          orchestratorTests: true
          versioning: None
          ORCHESTRATOR_CLUSTER: local-docker
          # Commented out: Using MiniStack tests instead of real AWS
          # AWS_STACK_NAME: game-ci-github-pipelines
          CHECKS_UPDATE: ${{ github.event.inputs.checksObject }}
        run: |
          yarn
          yarn run cli -m checks-update
      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            plugins/orchestrator/node_modules
            ${{ steps.yarn-config.outputs.cacheFolder }}
            plugins/orchestrator/.yarn/install-state.gz
          key: yarn-${{ runner.os }}-node-20-${{ hashFiles('plugins/orchestrator/yarn.lock') }}
        timeout-minutes: 5
        continue-on-error: true
