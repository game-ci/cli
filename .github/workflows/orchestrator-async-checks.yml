  PROJECT_PATH: test-project
  UNITY_VERSION: 2019.3.15f1
  USE_IL2CPP: false

jobs:
  asyncChecks:
    name: Async Checks
    if: github.event.event_type != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install package manager (from package.json)
        run: |
          corepack enable
          corepack install
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve yarn cache folder
        id: yarn-config
        run: echo "cacheFolder=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - name: Restore yarn install cache (node_modules + cacheFolder + install-state)
        uses: actions/cache@v4
        with:
          path: |
            plugins/orchestrator/node_modules
            ${{ steps.yarn-config.outputs.cacheFolder }}
            plugins/orchestrator/.yarn/install-state.gz
          key: yarn-${{ runner.os }}-node-20-${{ hashFiles('plugins/orchestrator/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-node-20-
      - timeout-minutes: 180
        env:
          # UNITY_LICENSE deliberately omitted here - the step inherits the
          # workflow-level value above. Re-declaring it from the stale secret
          # would shadow the working inline license.
          PROJECT_PATH: test-project
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_PRIVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_PLATFORM: StandaloneWindows64
          orchestratorTests: true
          versioning: None
          ORCHESTRATOR_CLUSTER: local-docker
          # Commented out: Using MiniStack tests instead of real AWS
          # AWS_STACK_NAME: game-ci-github-pipelines
          CHECKS_UPDATE: ${{ github.event.inputs.checksObject }}
        run: |
          yarn
          yarn run cli -m checks-update
