name: Engine Smoke Tests

on:
  push:
    branches: [main, 'release/**', 'feat/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      unity-version:
        description: 'Unity Editor version'
        required: false
        default: '2019.4.40f1'
      godot-version:
        description: 'Godot CI image tag'
        required: false
        default: '4.3'
      unreal-image:
        description: 'Custom Unreal Engine Docker image (optional, leave empty to skip UE test)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # ─── Which engines does this PR actually touch? ────────────────
  # These jobs pull multi-GB engine images (the Unity Windows pull alone
  # runs ~6 minutes), so running all of them on every PR is the single
  # biggest drag on review throughput. Anything touching the CLI core or
  # the plugin interface is cross-cutting and still runs everything.
  changes:
    name: Detect changed engines
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.filter.outputs.core }}
      unity: ${{ steps.filter.outputs.unity }}
      godot: ${{ steps.filter.outputs.godot }}
      unreal: ${{ steps.filter.outputs.unreal }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'src/cli.ts'
              - 'src/cli-commands.ts'
              - 'src/dependencies.ts'
              - 'src/index.ts'
              - 'src/plugin/**'
              - 'src/model/docker.ts'
              - 'src/model/system/**'
              - 'src/command/command-factory.ts'
              - 'package.json'
              - '.github/workflows/engine-smoke-test.yml'
            unity:
              - 'src/logic/unity/**'
              - 'src/model/unity/**'
              - 'src/model/unity-*.ts'
              - 'src/command/activate/**'
              - 'src/command/**/unity-*.ts'
              - 'src/command-options/unity-*.ts'
              - 'src/plugin/builtin/unity-plugin.ts'
              - 'src/middleware/engine-detection/unity-version-detector.ts'
              - 'dist/**'
            godot:
              - 'src/plugin/builtin/godot-plugin.ts'
              - 'src/**/godot*/**'
            unreal:
              - 'src/plugin/builtin/unreal-plugin.ts'
              - 'src/**/unreal*/**'

  # ─── Unity — detect + CLI-driven stub build ────────────────────
  unity-build:
    name: Unity stub build
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.unity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Unity engine detection
        run: |
          bun -e "
            import { UnityVersionDetector } from './src/middleware/engine-detection/unity-version-detector.ts';
            const v = UnityVersionDetector.getUnityVersion('test-project');
            console.log('Detected Unity version:', v);
            if (v !== '2019.4.40f1') throw new Error('Expected 2019.4.40f1, got ' + v);
          "

      - name: Build Unity CI stub
        run: |
          mkdir -p /tmp/unity-stub-ctx
          cat > /tmp/unity-stub-ctx/unity-editor <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          echo "Unity Editor CI stub"

          if printf '%s\n' "$*" | grep -q -- '-manualLicenseFile'; then
            echo "LICENSE SYSTEM [CI Stub] Next license update check is after 2099-01-01T00:00:00"
            exit 0
          fi

          BUILD_PATH=""
          while [ "$#" -gt 0 ]; do
            case "$1" in
              -customBuildPath)
                BUILD_PATH="$2"
                shift 2
                ;;
              *)
                shift
                ;;
            esac
          done

          if [ -n "$BUILD_PATH" ]; then
            mkdir -p "$(dirname "$BUILD_PATH")"
            echo "Unity CLI smoke artifact" > "$BUILD_PATH"
          fi

          cat <<'RESULTS'
          ###########################
          #      Build results      #
          ###########################
          Duration: 00:00:01
          Warnings: 0
          Errors: 0
          Size: 1 bytes
          RESULTS
          exit 0
          SCRIPT
          chmod +x /tmp/unity-stub-ctx/unity-editor

          cat > /tmp/unity-stub-ctx/Dockerfile <<'DOCKERFILE'
          FROM alpine:3.19
          RUN apk add --no-cache bash coreutils git
          COPY unity-editor /usr/local/bin/unity-editor
          RUN chmod +x /usr/local/bin/unity-editor
          WORKDIR /github/workspace
          DOCKERFILE

          docker build -t game-ci/unity-editor-stub:latest -f /tmp/unity-stub-ctx/Dockerfile /tmp/unity-stub-ctx

      - name: Run Unity CLI stub build
        run: |
          UNITY_VERSION="${{ github.event.inputs.unity-version || '2019.4.40f1' }}"

          bun run src/index.ts build test-project \
            --engineVersion "${UNITY_VERSION}" \
            --targetPlatform StandaloneLinux64 \
            --customImage game-ci/unity-editor-stub:latest \
            --unityLicense ci-stub-license

      - name: Verify build artifacts
        run: |
          # StandaloneLinux64 builds get a .x86_64 extension by default now
          # (matching unity-builder - see game-ci/cli#70), unless
          # --linux64RemoveExecutableExtension is passed.
          test -f build/StandaloneLinux64/StandaloneLinux64.x86_64
          grep -q "Unity CLI smoke artifact" build/StandaloneLinux64/StandaloneLinux64.x86_64
          echo "Unity CLI stub build verified"

      # Everything above runs `bun run src/index.ts`, which is dev mode: the
      # CLI reads the repo's own dist/ directly and the compiled code path is
      # never touched. That is what we ship, and until now CI only ever ran
      # `--help` against it.
      #
      # The gap was not theoretical. Both install scripts requested release
      # assets that did not exist and 404'd on every platform for an unknown
      # length of time (#242); a binary installed without its dist/ sibling
      # passed --help and then failed on any real build; and embedding the
      # assets (#243) shipped CRLF shell scripts on the first attempt, which
      # would have made the container entrypoint "#!/usr/bin/env bash<CR>" - a
      # bad interpreter line that fails every Unity build. None of that was
      # reachable by any test here.
      #
      # So run the same stub build again through the actual compiled binary,
      # deliberately placed where it has NO sibling dist/, forcing it to
      # resolve its assets the way a real installed binary does.
      # Compiled straight into /tmp rather than the repo: an untracked binary
      # in the working tree makes the branch dirty, and the CLI refuses to
      # derive a semantic version from a dirty branch, so the build below
      # would fail for a reason that has nothing to do with what is being
      # tested. (.gitignore now covers the bare binary too, but the build
      # under test should not depend on that being right.)
      - name: Build the shipped binary
        run: |
          mkdir -p /tmp/shipped-cli
          # Deliberately does not regenerate the embedded assets: tests.yml
          # already fails the PR if the committed copy has drifted from dist/,
          # and compiling from exactly what is committed is what a release
          # does too.
          bun build src/index.ts --compile --outfile /tmp/shipped-cli/game-ci

      - name: Run the stub build through the shipped binary (no sibling dist/)
        run: |
          UNITY_VERSION="${{ github.event.inputs.unity-version || '2019.4.40f1' }}"

          # Proves the binary is not quietly falling back to a dist/ next to
          # itself: there is nothing for it to fall back to.
          test ! -e /tmp/shipped-cli/dist

          # --allowDirtyBuild because the dev-mode build above already ran in
          # this workspace and left build/, test-project/Assets/Editor/ and a
          # generated dist/unity-config/services-config.json behind. Semantic
          # versioning refuses a dirty tree, which would fail this step for a
          # reason that has nothing to do with the binary under test.

          /tmp/shipped-cli/game-ci build test-project             --engineVersion "${UNITY_VERSION}"             --targetPlatform StandaloneLinux64             --customImage game-ci/unity-editor-stub:latest             --unityLicense ci-stub-license             --allowDirtyBuild             --buildsPath build-shipped

      - name: Verify the shipped binary produced a real build
        run: |
          test -f build-shipped/StandaloneLinux64/StandaloneLinux64.x86_64
          grep -q "Unity CLI smoke artifact" build-shipped/StandaloneLinux64/StandaloneLinux64.x86_64

          # The assets must have come from the embedded payload, extracted to
          # the content-addressed cache - not from anywhere on disk.
          test -d "$HOME/.game-ci/assets"
          extracted=$(find "$HOME/.game-ci/assets" -name entrypoint.sh -path '*ubuntu*' | head -1)
          test -n "$extracted"

          # The bug that shipped on the first attempt: CRLF line endings make
          # the shebang unusable inside the container. Assert the extracted
          # script is LF, so a regression fails here rather than in a user's
          # Unity build.
          # od prints a carriage return as a visible escape, so this detects
          # CRLF without embedding one in this file.
          if head -c 200 "$extracted" | od -An -c | grep -qF '\r'; then
            echo "Extracted entrypoint.sh has CRLF line endings - it would fail as a container entrypoint."
            exit 1
          fi

          echo "Shipped binary verified end to end against a real container"

  # ─── Unity — the Mirror#4128 abort message, end to end ─────────
  # The incident: a container aborted Unity, docker led its own stderr with the
  # benign "Unable to find image '...' locally" pre-pull notice, and the CLI's
  # final error appended that stderr under an "Original error:" heading. The
  # message therefore read as an editor failing to load a Unity version, while
  # Unity's real reason - a genuine script compile error - sat two lines above
  # it. Two Mirror maintainers went hunting for a version problem (see #288).
  #
  # src/model/docker.test.ts already asserts the corrected message, but it
  # hard-codes BOTH streams onto its fake error, so it stays green if Docker.run
  # reads the wrong stream or System.run ever folds them together. That plumbing
  # is precisely what broke. Nothing in CI ran a real `docker run` through it, so
  # this job does, and grades what the user is actually shown
  # (scripts/assert-unity-abort-message.sh, itself tested by its sibling in
  # tests.yml).
  #
  # Both CLI routes are exercised, because they reach stdout differently:
  # build.sh runs the editor with `-logfile /dev/stdout`, whereas test.sh writes
  # the log to a file and cats it after capturing the exit code. The stub below
  # honours whichever spelling it is handed.
  unity-abort-message:
    name: Unity abort message (Mirror#4128)
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.unity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same stub shape as unity-build's above, with two differences: it fails
      # the way the incident failed, and it puts each half on the stream reality
      # puts it on.
      #
      # Docker cannot supply the stderr half itself here: this image is built
      # locally a few lines up, so there is nothing for docker to pull and
      # docker writes nothing. The container emits that text on the stream docker
      # would have used, leading with the same benign "not cached locally" line.
      - name: Build aborting-editor stub
        run: |
          mkdir -p /tmp/unity-abort-stub-ctx
          cat > /tmp/unity-abort-stub-ctx/unity-editor <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          # Activation has to succeed, or runsteps.sh exits before ever reaching
          # the build/test step. Same licence line unity-build's stub prints,
          # which activate.sh greps for.
          if printf '%s\n' "$*" | grep -q -- '-manualLicenseFile'; then
            echo "LICENSE SYSTEM [CI Stub] Next license update check is after 2099-01-01T00:00:00"
            exit 0
          fi

          # Where Unity was told to write its log. build.sh passes
          # `-logfile /dev/stdout`; test.sh passes `-logFile <artifacts>/x.log`
          # and cats it afterwards. Honouring both keeps each route's abort
          # reason on the stream that route really puts it on.
          LOG_DEST=""
          while [ "$#" -gt 0 ]; do
            case "$1" in
              -logFile|-logfile)
                LOG_DEST="${2:-}"
                shift 2
                ;;
              *)
                shift
                ;;
            esac
          done

          # Docker's own stderr in the incident: harmless status output whose
          # first line names an image it is about to pull. Quoted back under an
          # "Original error:" heading, it read as an editor failing to load that
          # version.
          {
            echo "Unable to find image 'game-ci/unity-abort-stub:latest' locally"
            echo "latest: Pulling from game-ci/unity-abort-stub"
          } >&2

          # Unity's own reason, on Unity's own stream. The grader keys on this
          # exact pairing - and on the two stderr lines above - to prove the
          # incident was really reproduced rather than passing its absence
          # checks vacuously.
          print_abort() {
            echo "Aborting batchmode due to failure:"
            echo "Scripts have compiler errors."
          }

          if [ -z "$LOG_DEST" ] || [ "$LOG_DEST" = "/dev/stdout" ]; then
            print_abort
          else
            mkdir -p "$(dirname "$LOG_DEST")"
            print_abort > "$LOG_DEST"
          fi
          exit 1
          SCRIPT
          chmod +x /tmp/unity-abort-stub-ctx/unity-editor

          cat > /tmp/unity-abort-stub-ctx/Dockerfile <<'DOCKERFILE'
          FROM alpine:3.19
          RUN apk add --no-cache bash coreutils git
          COPY unity-editor /usr/local/bin/unity-editor
          RUN chmod +x /usr/local/bin/unity-editor
          WORKDIR /github/workspace
          DOCKERFILE

          docker build -t game-ci/unity-abort-stub:latest -f /tmp/unity-abort-stub-ctx/Dockerfile /tmp/unity-abort-stub-ctx

      # No --allowDirtyBuild here, unlike unity-build's second run: versioning's
      # dirty check is a yargs middleware registered inside
      # VersioningOptions.configure, which only `game-ci build` calls - `test`
      # never runs it. (It is also not an option there, and the CLI parses
      # strictly, so passing it would fail the invocation outright.)
      - name: Run the aborting build and grade the message
        # Declared as env rather than interpolated into the script body below:
        # ${{ }} expands into the source before bash ever sees it, which makes a
        # workflow_dispatch input shell code instead of data.
        env:
          UNITY_VERSION: ${{ github.event.inputs.unity-version || '2019.4.40f1' }}
        run: |
          set -uo pipefail
          LOG=/tmp/unity-abort-build.log

          # Captured to a FILE, never piped through tee: writes to a pipe are
          # asynchronous, so the CLI's process.exit(1) can truncate the very
          # message under test. File writes are synchronous.
          if bun run src/index.ts build test-project \
            --engineVersion "${UNITY_VERSION}" \
            --targetPlatform StandaloneLinux64 \
            --customImage game-ci/unity-abort-stub:latest \
            --unityLicense ci-stub-license \
            > "$LOG" 2>&1; then
            echo "::error::the aborting stub build was expected to fail, but exited 0"
            cat "$LOG"
            exit 1
          fi

          cat "$LOG"
          bash scripts/assert-unity-abort-message.sh "$LOG"

      # The incident was `game-ci test`, not `build`, and test.sh reaches stdout
      # by cat-ing the log file rather than via -logfile /dev/stdout. Same
      # Docker.run catch either way, but a future change to that cat's position
      # relative to the exit-code capture could lose the reason while the build
      # step above stayed green.
      - name: Run the aborting test and grade the message
        # Same reason as the build step above.
        env:
          UNITY_VERSION: ${{ github.event.inputs.unity-version || '2019.4.40f1' }}
        run: |
          set -uo pipefail
          LOG=/tmp/unity-abort-test.log

          # --docker is what selects the container flow; without it this would
          # run the experimental `unity test` CLI path instead.
          if bun run src/index.ts test test-project \
            --docker \
            --engineVersion "${UNITY_VERSION}" \
            --targetPlatform StandaloneLinux64 \
            --testPlatforms editmode \
            --coverageEnabled false \
            --customImage game-ci/unity-abort-stub:latest \
            --unityLicense ci-stub-license \
            > "$LOG" 2>&1; then
            echo "::error::the aborting stub test run was expected to fail, but exited 0"
            cat "$LOG"
            exit 1
          fi

          cat "$LOG"
          bash scripts/assert-unity-abort-message.sh "$LOG"

  # ─── Godot — detect + build using third-party image ────────────
  godot-build:
    name: Godot build
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.godot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Godot engine detection
        run: |
          bun -e "
            import { GodotVersionDetector } from './src/middleware/engine-detection/godot-version-detector.ts';
            const v = GodotVersionDetector.getGodotVersion('test-projects/godot-minimal');
            console.log('Detected Godot version:', v);
            if (v !== '4.3') throw new Error('Expected 4.3, got ' + v);
          "

      - name: Export Godot project in container
        run: |
          GODOT_VERSION="${{ github.event.inputs.godot-version || '4.3' }}"
          mkdir -p test-projects/godot-minimal/build

          docker run --rm \
            -v "${{ github.workspace }}/test-projects/godot-minimal:/project" \
            -w /project \
            "barichello/godot-ci:${GODOT_VERSION}" \
            bash -c '
              set -euo pipefail
              echo "Godot $(godot --headless --version)"
              mkdir -p build
              if [ -f export_presets.cfg ]; then
                if godot --headless --verbose --export-release "Linux/X11" build/game.x86_64 2>&1; then
                  echo "Godot export completed"
                else
                  echo "Godot export unavailable for minimal project, running import validation instead"
                  godot --headless --import 2>&1
                fi
              else
                echo "No export presets found, running import validation instead"
                godot --headless --import 2>&1
              fi
              ls -la build/
            '

      - name: Verify output
        run: |
          if [ -f test-projects/godot-minimal/build/game.x86_64 ]; then
            echo "Godot binary exported successfully"
          else
            echo "Godot project validated (import-only for minimal project)"
          fi

  # ─── UE — detect + stub build ─────────────────────────────────
  unreal-build:
    name: UE stub build
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.unreal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Unreal engine detection
        run: |
          bun -e "
            import { UnrealProjectDetector } from './src/middleware/engine-detection/unreal-project-detector.ts';
            const v = UnrealProjectDetector.getUnrealVersion('test-projects/unreal-minimal');
            console.log('Detected UE version:', v);
            if (v !== '5.4') throw new Error('Expected 5.4, got ' + v);
          "

      - name: Build UE CI stub
        run: |
          mkdir -p /tmp/ue-stub-ctx
          cat > /tmp/ue-stub-ctx/RunUAT.sh <<'SCRIPT'
          #!/bin/bash
          echo "=== RunUAT.sh (CI Stub) ==="
          PROJECT=""
          ARCHIVE_DIR=""
          for arg in "$@"; do
            case "$arg" in
              -project=*) PROJECT="${arg#-project=}" ;;
              -archivedirectory=*) ARCHIVE_DIR="${arg#-archivedirectory=}" ;;
            esac
          done
          if [ -n "$PROJECT" ] && [ -f "$PROJECT" ]; then
            echo "Project: $PROJECT"
            cat "$PROJECT"
          fi
          if [ -n "$ARCHIVE_DIR" ]; then
            mkdir -p "$ARCHIVE_DIR"
            echo "{\"engine\":\"unreal\",\"stub\":true}" > "$ARCHIVE_DIR/build-manifest.json"
          fi
          echo "=== Build OK ==="
          SCRIPT
          chmod +x /tmp/ue-stub-ctx/RunUAT.sh

          cat > /tmp/ue-stub-ctx/Dockerfile <<'DOCKERFILE'
          FROM alpine:3.19
          RUN apk add --no-cache bash
          RUN mkdir -p /home/ue4/UnrealEngine/Engine/Build/BatchFiles
          COPY RunUAT.sh /home/ue4/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh
          RUN chmod +x /home/ue4/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh
          WORKDIR /build
          DOCKERFILE

          docker build -t game-ci/ue-stub:latest -f /tmp/ue-stub-ctx/Dockerfile /tmp/ue-stub-ctx

      - name: Run UE stub build
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/test-projects/unreal-minimal:/build" \
            -w /build \
            game-ci/ue-stub:latest \
            /home/ue4/UnrealEngine/Engine/Build/BatchFiles/RunUAT.sh \
              BuildCookRun \
              -project=/build/MinimalTest.uproject \
              -targetplatform=Linux \
              -clientconfig=Shipping \
              -build -cook -stage -pak -archive \
              -archivedirectory=/build/output

      - name: Verify build artifacts
        run: |
          cat test-projects/unreal-minimal/output/build-manifest.json
          bun -e "
            const m = JSON.parse(require('fs').readFileSync('test-projects/unreal-minimal/output/build-manifest.json', 'utf-8'));
            if (m.engine !== 'unreal') throw new Error('wrong engine');
            console.log('UE stub build verified:', JSON.stringify(m));
          "

  # ─── Unreal Engine real image (manual only) ─────────────────────
  unreal-smoke-test:
    name: Unreal Engine smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.inputs.unreal-image != ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pull and verify Unreal Engine container
        run: |
          UE_IMAGE="${{ github.event.inputs.unreal-image }}"
          echo "Pulling: ${UE_IMAGE}"
          docker pull "${UE_IMAGE}"
          docker run --rm "${UE_IMAGE}" \
            bash -c "echo 'UE container OK'"

  # ─── Executable CLI Plugin Tests ────────────────────────────────
  protocol-tests:
    name: Executable CLI plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test CLI plugin system can load executable plugin
        run: |
          bun -e "
            import { CliProtocolPlugin } from './src/plugin/cli-protocol-plugin.ts';

            // Verify construction with executable path
            const plugin = new CliProtocolPlugin({ providerExecutable: '/usr/bin/echo' });
            console.log('CliProtocolPlugin constructed OK');

            // Verify all execution methods required by the CLI exist
            const methods = ['setupWorkflow', 'cleanupWorkflow', 'runTaskInWorkflow',
                           'garbageCollect', 'listResources', 'listWorkflow', 'watchWorkflow'];
            for (const m of methods) {
              if (typeof plugin[m] !== 'function') {
                throw new Error('Missing method: ' + m);
              }
            }
            console.log('All required CLI execution methods present');
          "

      - name: "Test PluginLoader handles executable: prefix"
        run: |
          bun -e "
            import { PluginLoader } from './src/plugin/plugin-loader.ts';
            import { PluginRegistry } from './src/plugin/plugin-registry.ts';

            PluginRegistry.reset();

            // Verify executable: prefix with a real binary on the system
            try {
              const plugin = await PluginLoader.load('executable:/usr/bin/echo');
              console.log('Loaded executable plugin:', plugin.name);
              console.log('Providers:', Object.keys(plugin.providers || {}));

              const providers = PluginRegistry.getAvailableProviders();
              console.log('Registered providers:', providers);

              if (!providers.includes('cli-protocol')) {
                throw new Error('cli-protocol provider not registered');
              }
              console.log('Executable plugin integration test PASSED');
            } catch (e) {
              console.error('Test failed:', e.message);
              process.exit(1);
            }
          "

      - name: Run CLI plugin tests
        run: bun test src/plugin/cli-protocol-plugin.test.ts

      - name: Run plugin loader tests
        run: bun test src/plugin/plugin-loader.test.ts

  # Aggregate gate. Branch protection should require THIS check rather
  # than the individual engine jobs above - a skipped-but-required job
  # blocks every path-scoped PR, which would defeat the filtering.
  smoke-gate:
    name: Engine smoke gate
    needs: [unity-build, unity-abort-message, godot-build, unreal-build, protocol-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify no engine smoke test failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "An engine smoke test failed."
            exit 1
          fi
          echo "All engine smoke tests that ran are green."
