name: Release CLI Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to (e.g., v0.1.0)'
        required: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            bun-target: bun-linux-x64
            binary: game-ci
            asset: game-ci-linux-x64.tar.gz
            binary_asset: game-ci-linux-x64
          - target: linux-arm64
            runner: ubuntu-latest
            bun-target: bun-linux-arm64
            binary: game-ci
            asset: game-ci-linux-arm64.tar.gz
            binary_asset: game-ci-linux-arm64
          - target: macos-x64
            runner: macos-latest
            bun-target: bun-darwin-x64
            binary: game-ci
            asset: game-ci-macos-x64.tar.gz
            binary_asset: game-ci-macos-x64
          - target: macos-arm64
            runner: macos-latest
            bun-target: bun-darwin-arm64
            binary: game-ci
            asset: game-ci-macos-arm64.tar.gz
            binary_asset: game-ci-macos-arm64
          - target: windows-x64
            runner: windows-latest
            bun-target: bun-windows-x64
            binary: game-ci.exe
            asset: game-ci-windows-x64.zip
            binary_asset: game-ci-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      # Pinned, unlike this repo's other bun-version: latest workflows:
      # v0.1.15's release build failed on all three "Verify binary
      # (native only)" runners (windows-x64, linux-x64, macos-arm64) with
      # `error: Cannot find module './src/cat' from '.../game-ci[.exe]'`
      # under Bun v1.4.0's --compile bundler - a transitive dependency's
      # dynamic-require pattern that v1.4.0 no longer resolves correctly
      # inside a standalone binary (no `./src/cat` exists anywhere in this
      # repo's own source, so this isn't a game-ci/cli bug to fix here).
      # 1.3.13 is the last version confirmed to compile cleanly. Bump this
      # deliberately once a Bun release is confirmed to build clean again,
      # not by drifting back to `latest` and re-breaking every release.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install

      # Regenerated rather than trusted from the checkout, so a release can
      # never ship a binary whose embedded assets are stale relative to
      # dist/. tests.yml separately fails the PR if the committed copy drifts.
      - name: Generate embedded assets
        run: bun run build:assets

      - name: Build standalone binary
        run: bun build src/index.ts --compile --target ${{ matrix.bun-target }} --outfile pkg/${{ matrix.binary }}

      # The binary now carries its own copy of dist/ and extracts it to a
      # content-addressed cache on first run, so it no longer NEEDS a sibling
      # dist/ (game-ci/cli#73). The archive keeps shipping one anyway: the
      # published unity-builder@v6.0.0-beta.1 is immutable, defaults to
      # cliVersion "latest", and downloads these archives - dropping dist/
      # from them would break it retroactively. It is now a compatibility
      # shell rather than a functional requirement, and also serves as the
      # fallback when the extraction cache can't be written.
      - name: Copy static assets alongside the binary
        shell: bash
        run: cp -r dist pkg/dist

      - name: Verify binary (native only)
        if: >-
          (matrix.target == 'macos-arm64' && runner.arch == 'ARM64') ||
          (matrix.target == 'macos-x64' && runner.arch == 'X64') ||
          (matrix.target == 'linux-x64') ||
          (matrix.target == 'windows-x64')
        run: ./pkg/${{ matrix.binary }} --help
        shell: bash

      - name: Package archive (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf ${{ matrix.asset }} -C pkg .

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path pkg\* -DestinationPath ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      # Published alongside the archive for packaging that expects a single
      # file (ubi, mise, and anything that extracts one binary and discards
      # the rest). That shape used to be actively broken - it produced a
      # binary that ran `--help` fine and then failed on any real build,
      # because dist/ was left behind - and is safe now the assets are
      # embedded.
      # Renamed to the per-target asset name before upload: the checksums job
      # downloads every artifact with merge-multiple, which merges by
      # filename, so four bare binaries all called "game-ci" would collide
      # and silently overwrite each other.
      - name: Name the bare binary per target
        shell: bash
        run: cp "pkg/${{ matrix.binary }}" "${{ matrix.binary_asset }}"

      - name: Upload bare binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_asset }}
          path: ${{ matrix.binary_asset }}

  checksums:
    name: Generate checksums and upload
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd binaries
          sha256sum game-ci-* > checksums.txt
          cat checksums.txt

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd binaries
          gh release upload "${{ steps.tag.outputs.tag }}" \
            game-ci-* checksums.txt \
            --repo ${{ github.repository }} \
            --clobber
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

  # Homebrew and Scoop pin an exact version + checksums per release and don't
  # auto-track GitHub releases, so without this job every release needed a
  # manual follow-up edit to game-ci/homebrew-tap and game-ci/scoop-bucket
  # (missed entirely for v0.1.51). Only runs for an actual published release
  # (not workflow_dispatch re-runs, which re-attach binaries to an existing
  # tag rather than cutting a new one).
  update-package-managers:
    name: Update Homebrew tap and Scoop bucket
    needs: checksums
    if: github.event_name == 'release' && needs.checksums.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game-ci/cli
        uses: actions/checkout@v4

      - name: Download checksums.txt from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.checksums.outputs.tag }}
        run: gh release download "$TAG" --repo ${{ github.repository }} --pattern checksums.txt --output checksums.txt --clobber

      # TAP_BUCKET_PAT is a fine-grained PAT scoped to only these two repos
      # (Contents: Read and write), not the broad token used elsewhere in
      # this org - both target repos are public, so a wider-scoped secret
      # sitting in a public repo's Actions secrets would be an unnecessarily
      # large blast radius if it ever leaked.
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: game-ci/homebrew-tap
          token: ${{ secrets.TAP_BUCKET_PAT }}
          path: homebrew-tap

      - name: Checkout scoop-bucket
        uses: actions/checkout@v4
        with:
          repository: game-ci/scoop-bucket
          token: ${{ secrets.TAP_BUCKET_PAT }}
          path: scoop-bucket

      - name: Update Homebrew formula
        env:
          TAG: ${{ needs.checksums.outputs.tag }}
        run: node scripts/release/update-homebrew-tap.mjs "$TAG" checksums.txt homebrew-tap/Formula/game-ci.rb

      - name: Update Scoop manifest
        env:
          TAG: ${{ needs.checksums.outputs.tag }}
        run: node scripts/release/update-scoop-bucket.mjs "$TAG" checksums.txt scoop-bucket/bucket/game-ci.json

      - name: Commit and push homebrew-tap
        env:
          TAG: ${{ needs.checksums.outputs.tag }}
        run: |
          cd homebrew-tap
          git config user.name "game-ci-bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "No changes to Formula/game-ci.rb, skipping."
            exit 0
          fi
          git add Formula/game-ci.rb
          git commit -m "Update game-ci to $TAG"
          git push

      - name: Commit and push scoop-bucket
        env:
          TAG: ${{ needs.checksums.outputs.tag }}
        run: |
          cd scoop-bucket
          git config user.name "game-ci-bot"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "No changes to bucket/game-ci.json, skipping."
            exit 0
          fi
          git add bucket/game-ci.json
          git commit -m "Update game-ci to $TAG"
          git push
