# Answers one question with evidence instead of inference: does our licensing
# strategy actually work, on the Unity versions we support - and fails the build
# when the answer changes.
#
# It exists because we repeatedly could not answer that. A community report
# (MirrorNetworking/Mirror, 2020.3.49f1) took four rounds and three shipped
# "fixes" to diagnose, and the decisive facts were only ever learned by reading
# a failing log in someone else's repo. Our unit tests could not have caught it:
# they stub the licensing client, and a stub cannot tell you which flags a real
# client rejects.
#
# Three things were wrong with the version of this workflow that produced those
# four rounds. Each is now fixed by construction rather than by care.
#
#   1. It was reporting-only. A red cell could not fail anything, so the one
#      signal that mattered was decorative.
#
#   2. It could not tell "this version cannot activate" from "this account
#      cannot activate anything right now". The run that concluded 2020.3.49f1
#      can never take a Personal seat was measured while the account was
#      refusing every activation; six days earlier the same account had assigned
#      a Personal serial on that exact version. The control cell below exists
#      only so that mistake is unreachable: with it red, no cell's colour
#      carries information about any version, in either direction.
#
#   3. It activated and returned as two separate `game-ci` commands, which are
#      two separate containers with two machine identities. A machine-bound seat
#      cannot round-trip that way - the return is refused with "Machine bindings
#      don't match" every time - so the matrix was measuring its own harness,
#      and the return half of the trip could never be graded. Every cell now
#      runs one `game-ci test`: activate, test, return in a single container,
#      which is also the only shape a user can run.
#
# Grading lives in scripts/licensing-verdict.sh, tested on every PR against
# captured real Unity logs, because every incident so far was a grading error
# rather than an activation error.
#
# Runs when it is useful and when it is not:
#   - on every PR and push to main that touches licensing code, via tests.yml
#   - weekly, because the account's seat state, Unity's entitlement service and
#     the published editor images all drift without a commit
#   - on demand via workflow_dispatch, for investigating a report
#
# An unreadable pattern, an empty table, a dead probe or a reverted account all
# fail: a run that measured nothing must never look like a run that found
# nothing wrong.

name: Licensing capability matrix

on:
  workflow_call:
    inputs:
      versions:
        description: Optional JSON array of Unity versions, overriding the default set.
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      versions:
        description: 'JSON array of Unity versions, e.g. ["2020.3.49f1","6000.6.0f1"]. Blank uses the default set. A custom set is an exploratory probe and does not gate.'
        type: string
        required: false
        default: ''
  schedule:
    # Weekly, off the hour. This is what makes the check permanent rather than a
    # snapshot of the day it was written: Unity's entitlement service, the
    # account's seat state and the editor images all change with no commit to
    # point at.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  # Activation consumes real seats on a shared account. Two runs of this
  # workflow at once would compete for them and report failures that are really
  # contention, which is exactly the kind of misleading signal this workflow
  # exists to eliminate.
  group: licensing-capability-matrix
  cancel-in-progress: false

jobs:
  # Secrets are unavailable to fork PRs. Without this the whole matrix would
  # report "cannot activate" for every cell and look like a catastrophic
  # regression, when it is really just an unprivileged context.
  preflight:
    name: Check credentials are available
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_account: ${{ steps.check.outputs.has_account }}
      has_serial: ${{ steps.check.outputs.has_serial }}
      versions: ${{ steps.check.outputs.versions }}
      gating: ${{ steps.check.outputs.gating }}
    steps:
      - id: check
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          VERSIONS_INPUT: ${{ inputs.versions }}
        run: |
          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "has_account=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_account=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UNITY_EMAIL/UNITY_PASSWORD unavailable - account activation cells will be skipped."
          fi

          if [ -n "$UNITY_SERIAL" ]; then
            echo "has_serial=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_serial=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UNITY_SERIAL unavailable - serial cells will be skipped."
          fi

          # The default set is chosen by licensing-client boundary, not by
          # popularity: 2020.3 ships client 1.12.1 (no --include-personal),
          # 6000.6 ships 1.18.3, and the middle entries cover where the
          # behaviour changed between them.
          if [ -n "$VERSIONS_INPUT" ]; then
            echo "versions=$VERSIONS_INPUT" >> "$GITHUB_OUTPUT"
            # A hand-picked version list is someone investigating something, not
            # a statement about what we support. It still measures, but a red
            # cell in it is a finding to read, not a reason to block an
            # unrelated PR.
            echo "gating=false" >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["2020.3.49f1","2022.3.62f3","6000.0.36f1","6000.6.0f1"]' >> "$GITHUB_OUTPUT"
            echo "gating=true" >> "$GITHUB_OUTPUT"
          fi

  # The discriminator. One combination known to work - a current editor on the
  # licensing-client route - measured exactly the way every cell below is. If
  # this cannot complete a round trip, the account or the environment is the
  # variable and no cell's result says anything about its Unity version. Both
  # directions matter: a green cell from a degraded run is as untrustworthy as a
  # red one, which is why `report` refuses to pass on either.
  #
  # It is also the account's canary. A Personal seat that cannot be taken here
  # means the shared account has run out - the failure that reached Mirror as
  # "one version fails now" and took a week of back-and-forth to attribute.
  control:
    name: Control (6000.0.36f1 · personal)
    needs: preflight
    if: needs.preflight.outputs.has_account == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      verdict: ${{ steps.cell.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # GATING is false so the cell asserts nothing about itself: the control is
      # the baseline, not a claim, and `report` is what turns its verdict into a
      # conclusion.
      - name: Run the control cell
        id: cell
        env:
          GATING: 'false'
          LICENSING_PROBE_OUTPUT_DIR: ${{ github.workspace }}/control-out
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          bash scripts/run-licensing-probe-cell.sh 6000.0.36f1 personal
          verdict="$(sed -n "s/^verdict='\(.*\)'$/\1/p" "control-out/results/6000.0.36f1-personal.txt")"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "Control verdict: $verdict"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licensing-control
          path: |
            control-out/results/
            control-out/cell.log
          if-no-files-found: warn

  probe:
    name: ${{ matrix.unityVersion }} · ${{ matrix.method }}
    needs: [preflight, control]
    if: needs.preflight.outputs.has_account == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Every cell must report. fail-fast would abort the run on the first
      # unsupported combination and destroy the very table this produces - and
      # an aborted matrix is what made Mirror's 2020.3 failure cancel its
      # sibling jobs and hide their results.
      fail-fast: false
      # Seats are finite and shared. Serialising keeps a red cell meaningful
      # (this combination cannot activate) rather than ambiguous (we had no
      # seat left to give it).
      max-parallel: 1
      matrix:
        unityVersion: ${{ fromJSON(needs.preflight.outputs.versions) }}
        method: [personal, serial]
    steps:
      - name: Decide whether this cell can run
        id: gate
        env:
          HAS_SERIAL: ${{ needs.preflight.outputs.has_serial }}
          METHOD: ${{ matrix.method }}
        run: |
          run_cell=true
          reason=""

          if [ "$METHOD" = "serial" ] && [ "$HAS_SERIAL" != "true" ]; then
            run_cell=false
            reason="no serial configured"
          fi

          echo "run_cell=$run_cell" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run_cell == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.gate.outputs.run_cell == 'true'
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.gate.outputs.run_cell == 'true'
        run: bun install --frozen-lockfile

      # One cell, graded against the control. Exits non-zero on a leaked seat or
      # a regression, so the failing combination is a red job and not merely a
      # row in a summary.
      - name: Run the probe cell
        if: steps.gate.outputs.run_cell == 'true'
        env:
          CONTROL_VERDICT: ${{ needs.control.outputs.verdict }}
          GATING: ${{ needs.preflight.outputs.gating }}
          # Only the serial cells receive a serial. The personal cells must not
          # see one, or they would silently exercise the serial path and report a
          # false positive for account activation.
          UNITY_SERIAL: ${{ matrix.method == 'serial' && secrets.UNITY_SERIAL || '' }}
          # The personal cells must not see one either.
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # Passed through the environment rather than interpolated into the
          # command line: on a workflow_dispatch run these come from the
          # `versions` input, and `${{ }}` inside `run:` is substituted before
          # the shell ever sees the line, so a crafted value would execute.
          MATRIX_VERSION: ${{ matrix.unityVersion }}
          MATRIX_METHOD: ${{ matrix.method }}
        run: bash scripts/run-licensing-probe-cell.sh "$MATRIX_VERSION" "$MATRIX_METHOD"

      - name: Record a skipped cell
        if: steps.gate.outputs.run_cell != 'true'
        env:
          MATRIX_VERSION: ${{ matrix.unityVersion }}
          MATRIX_METHOD: ${{ matrix.method }}
          SKIP_REASON: ${{ steps.gate.outputs.reason }}
        run: |
          mkdir -p results
          {
            echo "unityVersion='$MATRIX_VERSION'"
            echo "method='$MATRIX_METHOD'"
            echo "verdict='skipped'"
            echo "classification='skipped'"
            echo "client='-'"
            echo "required='false'"
            echo "note='$SKIP_REASON'"
          } > "results/$MATRIX_VERSION-$MATRIX_METHOD.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licensing-probe-${{ matrix.unityVersion }}-${{ matrix.method }}
          path: |
            results/
            cell.log
          if-no-files-found: warn

  # The table, and the gate. Both, in that order: a matrix that only reports is
  # what let four rounds of regression through, and a gate without a table is a
  # red X nobody can act on.
  report:
    name: Capability report
    needs: [preflight, control, probe]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Both downloads tolerate a missing artifact so that the gate below, not
      # this step, is what explains the outcome. A fork PR has no credentials
      # and therefore no artifacts, and `download-artifact` fails outright when
      # an artifact is absent - which would have blocked exactly the PRs that
      # have nothing to measure and should pass.
      - uses: actions/download-artifact@v4
        if: needs.preflight.outputs.has_account == 'true'
        continue-on-error: true
        with:
          name: licensing-control
          path: collected-control

      - uses: actions/download-artifact@v4
        if: needs.preflight.outputs.has_account == 'true'
        continue-on-error: true
        with:
          pattern: licensing-probe-*
          merge-multiple: true
          path: collected

      - name: Render capability table
        env:
          HAS_ACCOUNT: ${{ needs.preflight.outputs.has_account }}
          CONTROL_VERDICT: ${{ needs.control.outputs.verdict }}
        run: |
          {
            echo "## Unity licensing capability matrix"
            echo ""
            echo "What actually works, measured against real editors, end to end in"
            echo "one container - activate, test, return."
            echo ""
            echo "| Cell | Round trip | Verdict | Licensing client | Classification |"
            echo "| --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          row() {
            local label="$1" file="$2"
            # Every field is unset first: these files are sourced, and a field
            # absent from one of them would otherwise silently inherit the
            # previous row's value.
            unset unityVersion method verdict classification client required
            # shellcheck disable=SC1090
            . "$file"
            case "${verdict:-}" in
              pass)               icon="✅ passes" ;;
              fail:seat-leaked*)  icon="🔥 leaked a seat" ;;
              fail:no-activation*) icon="❌ cannot activate" ;;
              unknown:*)          icon="⚠️ probe never reached Unity" ;;
              *)                  icon="⏭️ skipped" ;;
            esac
            case "${classification:-}" in
              baseline)               verdict_class="⚪ baseline" ;;
              ok)                     verdict_class="🟢 ok" ;;
              capability-regression)  verdict_class="🔴 regression" ;;
              account-or-environment) verdict_class="🟠 account/environment" ;;
              inconclusive)           verdict_class="⚠️ inconclusive" ;;
              *)                      verdict_class="⏭️ skipped" ;;
            esac
            echo "| $label | $icon | \`${verdict:-?}\` | ${client:-–} | $verdict_class |" \
              >> "$GITHUB_STEP_SUMMARY"
          }

          shopt -s nullglob

          if [ "$HAS_ACCOUNT" != "true" ]; then
            echo "| _(no credentials in this context)_ | ⏭️ skipped | – | – | ⏭️ skipped |" >> "$GITHUB_STEP_SUMMARY"
          else
            for f in collected-control/results/*.txt; do
              row "**control** (6000.0.36f1 · personal)" "$f"
            done
            for f in collected/results/*.txt; do
              local_version="$(sed -n "s/^unityVersion='\(.*\)'$/\1/p" "$f")"
              local_method="$(sed -n "s/^method='\(.*\)'$/\1/p" "$f")"
              row "$local_version · $local_method" "$f"
            done
          fi

          {
            echo ""
            echo "**How to read this.** A pass requires positive evidence that a seat"
            echo "was granted *and* positively returned - never the absence of a known"
            echo "failure string, and never the script's own \"Activation complete.\","
            echo "which is printed even when Unity assigned nothing."
            echo ""
            echo "Every cell is graded *relative to the control*, not on its own."
            echo ""
            echo "- **ok** - the control completed a round trip and so did this cell."
            echo "- **regression** - the control did and this cell did not, so this"
            echo "  Unity version, method or flag combination is broken. This is the"
            echo "  only classification that is a statement about a Unity version."
            echo "- **account/environment** - the control could not complete a round"
            echo "  trip either. The account or the environment is the variable and"
            echo "  **no** cell's colour, green or red, says anything about its"
            echo "  version. When the account is out of Personal seats, release them"
            echo "  at https://id.unity.com/ and re-run."
            echo "- **inconclusive** - the probe died before reaching Unity."
            echo ""
            echo "Control verdict for this run: \`$CONTROL_VERDICT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate on the result
        env:
          CONTROL_VERDICT: ${{ needs.control.outputs.verdict }}
          GATING: ${{ needs.preflight.outputs.gating }}
          HAS_ACCOUNT: ${{ needs.preflight.outputs.has_account }}
        run: |
          if [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::notice::No account credentials in this context (fork PR?) - nothing to measure, which is not a failure."
            exit 0
          fi

          echo "Control verdict: $CONTROL_VERDICT"

          # Before anything else, and in both directions. A run whose control
          # could not activate cannot certify a version any more than it can
          # condemn one - and the conclusion that 2020.3.49f1 can never take a
          # Personal seat came from exactly this state.
          if [ "$CONTROL_VERDICT" != "pass" ]; then
            echo "::error::The control cell could not complete a Personal round trip ($CONTROL_VERDICT). This run measured the account, not Unity, so no cell here is evidence about any version. Check the account's seats at https://id.unity.com/ before reading anything else."
            exit 1
          fi

          shopt -s nullglob
          cell_files=(collected/results/*.txt)

          if [ "${#cell_files[@]}" -eq 0 ]; then
            echo "::error::The control passed but no cell produced a result - the matrix measured nothing, which is not the same as finding nothing wrong."
            exit 1
          fi

          regressions=""
          inconclusive=""
          leaked=""

          for f in "${cell_files[@]}"; do
            unset unityVersion method verdict classification required
            # shellcheck disable=SC1090
            . "$f"
            case "${verdict:-}" in
              fail:seat-leaked*) leaked="$leaked ${unityVersion}/${method}" ;;
            esac
            case "${classification:-}" in
              capability-regression) regressions="$regressions ${unityVersion}/${method}" ;;
              inconclusive)          inconclusive="$inconclusive ${unityVersion}/${method}" ;;
            esac
          done

          # Named on its own because it is the failure that damages every later
          # run on the account, not just this one - and until this gate existed
          # nothing failed on it: return_license.sh only warns, and the CLI exits
          # 0 either way.
          if [ -n "$leaked" ]; then
            echo "::error::Seat leaked on:$leaked - activation succeeded but no return was observed. Release the seats at https://id.unity.com/ and fix the return path before re-running."
            exit 1
          fi

          if [ -n "$inconclusive" ]; then
            echo "::error::Probe never reached Unity on:$inconclusive. Not a licensing finding, but those combinations were not measured, and an unmeasured cell must not read as a pass."
            exit 1
          fi

          if [ -n "$regressions" ]; then
            if [ "$GATING" = "true" ]; then
              echo "::error::Licensing regressed against the control on:$regressions. The control completed a round trip, so this is about those Unity versions, not the account."
              exit 1
            fi
            echo "::warning::Exploratory run (custom version list) - not gating. Regressions seen:$regressions"
          fi

          echo "All cells completed a full activate/test/return round trip."
