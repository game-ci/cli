# One-shot, dispatch-only probe for "is there any way to activate this?".
#
# The capability matrix answers "does our current code path work". This answers
# the different and harder question of whether a *different* path would, which
# is what you need before telling someone their Unity version is unsupported.
#
# It exists because the matrix measured account activation failing on Unity
# 2020.3 (client 1.12.1 has no --include-personal, and --activate-all alone
# does not cover Personal seats) and that was nearly reported as "2020.3 cannot
# do Personal activation at all" - a much broader claim, resting on a single
# untried code path. These probes try the alternatives directly.
#
# Read-only in intent: every probe that could take a seat returns it in the
# same step, and the whole thing runs on demand rather than on any trigger.
name: Licensing diagnostic (one-shot)

on:
  workflow_dispatch:
    inputs:
      unityVersion:
        description: Unity version to probe, e.g. 2020.3.49f1
        type: string
        required: true
        default: '2020.3.49f1'
      image:
        description: Editor image tag suffix (base, linux-il2cpp, ...)
        type: string
        required: false
        default: 'base'

permissions:
  contents: read

concurrency:
  # Deliberately NOT the capability matrix's group, even though both take seats
  # from the same account.
  #
  # A concurrency group keeps only one *pending* run: a newer entrant cancels an
  # older one that has not started. Sharing the matrix's group therefore meant a
  # manual dispatch cancelled whatever matrix run was queued behind it - observed
  # on 2026-09-18, when dispatching this workflow cancelled the licensing job of
  # a PR's Tests run. That is a real red on a real PR caused by nothing, and
  # `Tests gate` cannot tell it apart from a suite that failed.
  #
  # The cost of separating them is that a diagnostic can now overlap a matrix
  # run, so the two can briefly contend for a seat. That is the lesser evil: it
  # is bounded to this rare, manually-dispatched workflow, and it is detectable
  # rather than silent - contention makes the matrix's control cell fail, and the
  # report grades every cell `account-or-environment` when it does.
  group: licensing-diagnostic
  cancel-in-progress: false

jobs:
  probe:
    name: Probe ${{ inputs.unityVersion }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run activation probes inside the editor image
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          IMAGE: unityci/editor:ubuntu-${{ inputs.unityVersion }}-${{ inputs.image }}-3
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Account credentials unavailable - nothing to probe."
            exit 1
          fi

          cat > probe.sh <<'PROBE'
          #!/usr/bin/env bash
          # Intentionally not `set -e`: every probe must run even when an
          # earlier one fails, because the point is to compare their outcomes.
          CLIENT=/opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client

          banner() { echo; echo "=============== $* ==============="; }

          # The client prints its version banner on --help; there is no
          # --version option on 1.12.1.
          banner "client version"
          "$CLIENT" --help 2>&1 | head -n 2

          banner "PROBE 1: what does this account actually hold? (--showEntitlements)"
          "$CLIENT" --showEntitlements --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" 2>&1 | head -n 60
          echo "exit=${PIPESTATUS[0]}"

          # Deliberately BEFORE any entitlement priming, and deliberately with
          # the same editor invocation as PROBE 3 below - one variable apart.
          #
          # The capability matrix fails 2020.3.49f1/personal through the CLI's
          # own activate path, while a probe on 2026-09-11 succeeded on the same
          # editor and account. The two differ in exactly two ways: this script
          # runs --activate-all (PROBE 2, which writes
          # UnityEntitlementLicense.xml) before the editor, and the matrix runs
          # the editor inside a Unity project. Comparing this probe against
          # PROBE 3 isolates the first, because both run without a project.
          #
          # If this fails and PROBE 3 succeeds, the priming is the difference
          # and the fix belongs in the activation script. If both fail, the
          # entitlement service is refusing this route outright and priming is
          # irrelevant.
          banner "PROBE 1b: editor BEFORE any entitlement priming (no project)"
          unity-editor -logFile /dev/stdout -batchmode -nographics -quit \
            -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" 2>&1 | tail -n 40
          echo "exit=${PIPESTATUS[0]}"

          banner "PROBE 2: current code path (--activate-all, no --include-personal)"
          "$CLIENT" --activate-all --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" 2>&1 | head -n 40
          echo "exit=${PIPESTATUS[0]}"
          "$CLIENT" --return-ulf >/dev/null 2>&1 || true

          banner "PROBE 3: editor, account only, NO serial (historical personal path)"
          # This is the route never tried on this version. The serial path uses
          # -serial as well; Unity documents that as not applying to Personal,
          # which is exactly why account-only is worth testing on its own.
          unity-editor -logFile /dev/stdout -batchmode -nographics -quit \
            -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" 2>&1 | tail -n 40
          echo "exit=${PIPESTATUS[0]}"

          banner "PROBE 4: --syncEntitlements"
          "$CLIENT" --syncEntitlements --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" 2>&1 | head -n 30
          echo "exit=${PIPESTATUS[0]}"

          banner "PROBE 5: entitlements again, after the attempts above"
          "$CLIENT" --showEntitlements --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" 2>&1 | head -n 60
          echo "exit=${PIPESTATUS[0]}"

          # Does a return succeed when it runs in the SAME container as the
          # activation? The capability matrix runs `activate` and
          # `return-license` as separate commands, so they get separate
          # containers and separate machine identities, and the return always
          # fails on a binding mismatch. A normal build sources both in one
          # container, so it should NOT - but that was never measured, and a
          # user reports the return failing every time in a normal build.
          #
          # Machine Id is printed either side, because that is the whole
          # question: if it is stable within the container and the return still
          # fails, the container split is not the explanation.
          if [ -n "${UNITY_SERIAL:-}" ]; then
            banner "PROBE 6: serial activation (same container)"
            unity-editor -logFile /dev/stdout -batchmode -nographics -quit \
              -serial "$UNITY_SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" 2>&1 \
              | grep -iE "Machine Id|Serial number assigned|Next license update|error" | head -n 15
            echo "exit=${PIPESTATUS[0]}"

            banner "PROBE 7: return it, same container"
            unity-editor -logFile /dev/stdout -batchmode -nographics -quit \
              -returnlicense 2>&1 \
              | grep -iE "Machine Id|return|error" | head -n 20
            echo "exit=${PIPESTATUS[0]}"
          else
            banner "PROBE 6/7 skipped: no UNITY_SERIAL"
          fi

          # What client 1.12.1 can actually be asked to do.
          #
          # Every conclusion drawn about this version so far has rested on one
          # assumed absence - that 1.12.1 has no --include-personal - and on
          # --activate-all, which asks for a subscription seat the account does
          # not have and answers "No seat available". Nobody has ever read the
          # option list. If it offers any route to a Personal seat, --activate-all
          # is simply the wrong call and this version is not unsupported at all.
          banner "PROBE 8: every option client 1.12.1 accepts"
          "$CLIENT" --help 2>&1

          banner "PROBE 9: activation-shaped options actually accepted"
          # Each attempt is followed by a return, so a route that works does not
          # leave the seat held by the probe. exit 33 is how this client refuses
          # an option it does not have, which is the answer for most of these.
          for FLAG in --activate-all --include-personal --activate-personal \
                      --activate-seat --request-personal --updateEntitlementLicense \
                      --syncEntitlements --activate-ulf; do
            echo "--- $FLAG"
            "$CLIENT" "$FLAG" --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" 2>&1 | head -n 12
            echo "exit=${PIPESTATUS[0]}"
            "$CLIENT" --return-ulf >/dev/null 2>&1 || true
          done

          # PROBE 9 found it: on the client 2020.3 bundles, --activate-ulf with
          # account credentials and no serial returns "Successfully activated
          # ULF license". Every conclusion drawn about this version rested on
          # --activate-all, whose own help text says it activates
          # *subscriptions* - which a Personal account does not have, hence the
          # "No seat available" that was read as "this version cannot do this".
          #
          # These probes check the other half, which matters more than the
          # first: a licence we cannot give back is worse than one we never
          # took. PROBE 11 confirms the editor actually sees it, and PROBE 12
          # confirms it can be returned.
          banner "PROBE 10: --activate-ulf, and the files it leaves behind"
          "$CLIENT" --return-ulf >/dev/null 2>&1 || true
          "$CLIENT" --activate-ulf --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" 2>&1 | head -n 10
          echo "exit=${PIPESTATUS[0]}"
          # Where it wrote, so the return path is a measured fact rather than an
          # assumption - the cleanup in PROBE 9 reported "Ulf license file not
          # found" at the path return_license.sh looks in.
          find /root/.local/share/unity3d /root/.config/unity3d -name '*.ulf' 2>/dev/null | head -n 10
          find /root/.local/share/unity3d /root/.config/unity3d -name '*.xml' 2>/dev/null | head -n 10

          # No -username/-password here, deliberately, and this is the whole
          # value of the probe. With credentials the editor can satisfy itself
          # from the account and the run says nothing about whether PROBE 10's
          # ULF was ever usable; a licensed editor with NO credentials can only
          # have got its licence from a file on disk. That is the difference
          # between "--activate-ulf wrote something" and "--activate-ulf wrote
          # something the editor accepts", and only the second is a fix.
          banner "PROBE 11: does the editor see a licence now? (NO credentials)"
          unity-editor -logFile /dev/stdout -batchmode -nographics -quit 2>&1 \
            | grep -iE "Licensing|Serial number assigned|License is not active|No valid Unity|Pro License" | head -n 20
          echo "exit=${PIPESTATUS[0]}"

          banner "PROBE 12: return the seat, same container"
          "$CLIENT" --return-ulf 2>&1 | head -n 10
          echo "exit=${PIPESTATUS[0]}"
          "$CLIENT" --showEntitlements --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" 2>&1 | head -n 10 || true

          banner "cleanup: return anything that was taken"
          "$CLIENT" --return-ulf 2>&1 | head -n 10 || true
          PROBE
          chmod +x probe.sh

          docker run --rm \
            --env UNITY_EMAIL --env UNITY_PASSWORD --env UNITY_SERIAL \
            --volume "$PWD/probe.sh:/probe.sh:ro" \
            "$IMAGE" /bin/bash /probe.sh 2>&1 | tee diagnostic.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licensing-diagnostic-${{ inputs.unityVersion }}
          path: diagnostic.log
          if-no-files-found: warn

      - name: Summarise
        if: always()
        env:
          VERSION: ${{ inputs.unityVersion }}
        run: |
          {
            echo "## Licensing diagnostic - $VERSION"
            echo ""
            echo "Probes, in the order they run:"
            echo ""
            echo "| # | What it asks |"
            echo "| --- | --- |"
            echo "| 1 | \`--showEntitlements\` - what does the account hold |"
            echo "| 1b | editor, account credentials, **before** any priming |"
            echo "| 2 | \`--activate-all\` - the CLI's current code path |"
            echo "| 3 | editor, account credentials, after priming |"
            echo "| 4 | \`--syncEntitlements\` |"
            echo "| 5 | \`--showEntitlements\` again, after the attempts |"
            echo "| 6 | editor with \`-serial\` |"
            echo "| 7 | \`-returnlicense\`, same container |"
            echo "| 8 | the client's full \`--help\` |"
            echo "| 9 | every activation-shaped option it might accept |"
            echo "| 10 | \`--activate-ulf\`, and the licence files it leaves |"
            echo "| 11 | editor **without** credentials - does it see that licence |"
            echo "| 12 | \`--return-ulf\`, same container |"
            echo ""
            echo "Compare 1b against 3: they differ only by the priming in probe 2,"
            echo "so if they disagree, priming is the variable. Compare 10 against"
            echo "11: 11 carries no credentials, so a licensed editor there can only"
            echo "have got it from the ULF that 10 wrote."
            echo ""
            echo "Look for a seat assignment (\`ASSIGN_SEAT\`), a serial being"
            echo "assigned, or a \`--activate-ulf\` success. Any of those in a probe"
            echo "the CLI does not use is a route this version supports and we are"
            echo "not taking."
          } >> "$GITHUB_STEP_SUMMARY"
